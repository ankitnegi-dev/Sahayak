name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Create test database and role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE USER parentbot WITH PASSWORD 'parentbot';"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE parentbot_test OWNER parentbot;"
          psql -h localhost -U postgres -d postgres -c "ALTER USER parentbot SUPERUSER;"
          psql -h localhost -U postgres -d postgres -c "CREATE USER sahayak_app WITH PASSWORD 'sahayak_app';"

      - name: Run migrations
        env:
          DATABASE_URL: postgres://parentbot:parentbot@localhost:5432/parentbot_test?sslmode=disable
        run: |
          export GOOSE_DRIVER=postgres
          export GOOSE_DBSTRING="postgres://parentbot:parentbot@localhost:5432/parentbot_test?sslmode=disable"
          goose -dir migrations up

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://parentbot:parentbot@localhost:5432/parentbot_test?sslmode=disable
          CI: "true"
        run: go test -tags integration -race -p 1 -timeout 600s ./internal/...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build api and worker
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/api ./cmd/api
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/worker ./cmd/worker

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
